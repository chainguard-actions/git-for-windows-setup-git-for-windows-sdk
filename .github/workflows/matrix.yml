name: 'test all artifact flavors'
on: # since this is expensive, require a manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ['minimal', 'makepkg-git', 'build-installers', 'full']
        architecture: ['i686', 'x86_64', 'ucrt64']
        exclude:
          - flavor: minimal
            architecture: i686
          - flavor: makepkg-git
            architecture: i686
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: run in-place
        uses: ./
        with:
          flavor: ${{ matrix.flavor }}
          architecture: ${{ matrix.architecture }}
      - name: build installer
        if: matrix.flavor == 'build-installers'
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          # clone build-extra
          git clone --depth 1 --single-branch -b main https://github.com/git-for-windows/build-extra &&
          # build installer
          ./build-extra/installer/release.sh --output="$PWD/installer-$ARCHITECTURE" 0-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.flavor == 'build-installers'
        with:
          name: installer-${{ matrix.architecture }}
          path: installer-${{ matrix.architecture }}
