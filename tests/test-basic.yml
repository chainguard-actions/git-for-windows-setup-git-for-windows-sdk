name: Test basic usage - minimal flavor x86_64
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          flavor: minimal
          architecture: x86_64
          github-token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (on Linux it skips with a warning, which is expected)"
          echo "PASS: action completed without error"
