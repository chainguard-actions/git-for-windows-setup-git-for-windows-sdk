name: Test MSYS mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          flavor: minimal
          architecture: x86_64
          msys: 'true'
          path: ${{ github.workspace }}/git-sdk-msys
          verbose: '10'
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran in MSYS mode (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in MSYS mode (on non-Windows it skips with a warning)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (may be expected in harness environment)"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action was skipped (node24 may not be available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
