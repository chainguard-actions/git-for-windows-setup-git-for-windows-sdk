name: Test custom path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          flavor: minimal
          architecture: x86_64
          path: /tmp/git-sdk-test
          github-token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Custom path action completed successfully"
          echo "On Linux the action skips with a warning (Windows-only action), which is expected"
          echo "PASS: custom path action completed without error"
